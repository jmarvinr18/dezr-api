[project]
name = "dezr-api"
version = "0.1.0"
description = "Flask API for dezr-ui (deszr.com): site settings, pages, media, contact form and the admin area"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.0",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-smorest>=0.47.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "markdown-it-py>=3.0.0",
    "marshmallow>=4.0.0",
    "pdfplumber>=0.11.4",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.2.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.1.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.1.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
